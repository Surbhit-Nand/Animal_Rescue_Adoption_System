# fly.toml app configuration file generated for animal-rescue-adoption-system on 2026-11-11T10:36:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'animal-rescue-adoption-system'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    VITE_CLERK_PUBLISHABLE_KEY = 'pk_test_Ymxlc3NlZC10YWhyLTU1MjEuY2xlcmsuYWNjb3VudHMuZGV2JA'

[env]
  API_PORT = '8080'
  CLIENT_DIST_DIR = '/app/dist'
  CLIENT_ORIGIN = 'https://animal-rescue-adoption-system.fly.dev'
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
